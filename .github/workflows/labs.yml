name: labs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build every lab image, then run every package test suite
        run: python scripts/docker_labs.py ci -j 2
      - name: Docs and copyedit lint
        run: |
          pip install -r docker/requirements.lock
          python scripts/copyedit_lint.py --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-test-results
          path: build/test-results/
