name: labs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build every lab image, then run every package test suite
        run: python scripts/docker_labs.py ci -j 2
      - name: Docs and copyedit lint
        run: |
          pip install -r docker/requirements.lock
          python scripts/copyedit_lint.py --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-test-results
          path: build/test-results/

  l2-cpu-fallback:
    # GitHub-hosted runners have no GPU: build the CPU-only torch variant of every L2 image and prove
    # each experiment's CPU fallback runs and passes its invariants; also validate the committed
    # GPU and CPU evidence bundles.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: L2 code parses with the images' Python 3.11 grammar
        run: |
          python - <<'EOF'
          import ast, glob, sys
          files = glob.glob("book/*/*/lab/l2/*.py") + glob.glob("capstones/*/starter-kit/l2/*.py") + glob.glob("docker/hwlab/*.py")
          bad = []
          for f in files:
              try:
                  ast.parse(open(f, encoding="utf-8").read(), filename=f, feature_version=(3, 11))
              except SyntaxError as e:
                  bad.append(f"{f}:{e.lineno}: {e.msg}")
          print(f"{len(files)} files parsed, {len(bad)} syntax errors")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          EOF
      - name: Build CPU-only L2 images
        run: python scripts/hw_labs.py build --cpu-image
      - name: Run L2 tests (CPU fallback now + committed evidence)
        run: python scripts/hw_labs.py test --device cpu
