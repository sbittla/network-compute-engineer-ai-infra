id: '20.9'
title: Drift policy and break-glass for the ORION fabric
folder: 20.9-drift-policy-break-glass
type: design-challenge
difficulty: 3
tier: L1
kind: written
points: 15
evidence_required: A policy table (field class x behaviour x rationale), a break-glass procedure, and two scenario
  walk-throughs.
marking:
- criterion: Policy table splits fields by ownership and risk (invariants auto-revert, tunables alert with exemption,
    admin state via lifecycle)
  points: 5
- criterion: 'Break-glass: who, scoped exemption object, expiry <= 24 h, audit record, mandatory follow-up PR; single
    writer per field and oscillation alert'
  points: 5
- criterion: Two scenario walk-throughs showing the policy's behaviour, including one incident tuning and one harmful
    hand edit
  points: 5
lab_checks: []
