id: 20.1.1
title: Idempotent operations
folder: 20.1.1-idempotency
type: knowledge-check
difficulty: 1
tier: L1
kind: written
points: 4
evidence_required: Written answer (2–5 sentences) that names the mechanism, not just the term.
marking:
- criterion: 'Correct definition: once or many applications yield the same end state (not ''safe'')'
  points: 1
- criterion: A naturally idempotent ORION operation (e.g. set MTU 9000, gNMI replace of a QoS map)
  points: 1
- criterion: A non-idempotent ORION operation (firmware flash + reset, reboot, append, IP allocation)
  points: 1
- criterion: 'Retry-safety technique: check running state before acting, read back, idempotency key per change/target'
  points: 1
lab_checks: []
