    reasons
  points: 5
- criterion: A discriminating test for each hypothesis
  points: 4
- criterion: Root cause explaining time of day and rack locality; safe facilities change; validation with
    thresholds (inlet ≤ 27 °C, no 0x20, p99/p50 ≤ 3 %)
  points: 5
- criterion: 'Lifecycle decision: no fault drain/repair/RMA; steer or maintenance-drain against the rack,
    referencing FAC-2210'
  points: 3
