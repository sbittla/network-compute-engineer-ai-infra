id: M1
title: Node acceptance test design
folder: M1-node-acceptance-design
type: outline-mandated
difficulty: 2
tier: L1
kind: written
points: 20
evidence_required: A table with ≥ 12 checks in fail-fast order; every threshold labelled with its evidence
  class; a total duration estimate; the policy-version field you will record.
marking:
- criterion: 'Coverage: ≥ 12 checks spanning discovery, memory, NIC link, storage, thermals, burn-in,
    NVLink, RDMA pairs, single-node NCCL'
  points: 8
- criterion: Fail-fast order (cheap inventory/topology first, burn-in late, NCCL last)
  points: 4
- criterion: Thresholds labelled with evidence class; FAIL vs WARN classes correct
  points: 5
- criterion: Total duration (≈ 25 h with 24 h burn-in) and policy-version field recorded
  points: 3
lab_checks: []
