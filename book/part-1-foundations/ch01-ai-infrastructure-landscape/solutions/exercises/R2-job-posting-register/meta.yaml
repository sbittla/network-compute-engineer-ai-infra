id: R2
title: A dated job-posting register
folder: R2-job-posting-register
type: reflection
difficulty: 2
tier: L1
kind: written
points: 4
evidence_required: A register of at least 5 postings across at least 3 employer groups with the Section 1.8 fields, and a reasoned statement of what it can and cannot support.
marking:
  - criterion: Register has at least 5 postings from at least 3 employer groups, with every Section 1.8 field including the date checked
    points: 2
  - criterion: States what can be concluded (recurring skills in the sample on that date) and what cannot (market share, trends, completeness)
    points: 1
  - criterion: Explains why every market claim must be dated (postings change weekly, so an undated claim cannot be verified or refreshed)
    points: 1
lab_checks: []
