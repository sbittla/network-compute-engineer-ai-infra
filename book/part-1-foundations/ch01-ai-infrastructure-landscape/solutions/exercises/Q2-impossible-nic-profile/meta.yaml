id: Q2
title: A profile that exceeds NIC line rate
folder: Q2-impossible-nic-profile
type: knowledge-check
difficulty: 1
tier: L1
kind: computed
points: 3
evidence_required: The implied rate against line rate, and the conclusion with plausible causes.
marking:
  - criterion: Implied rate 40 GB / 0.5 s = 80 GB/s computed with units
    points: 1
  - criterion: Compared with 400 Gb/s = 50 GB/s line rate and declared impossible (ceiling fraction 1.6)
    points: 1
  - criterion: At least two plausible data causes (TX + RX summed, two NICs aggregated, bits/bytes confusion, wrong time window)
    points: 1
