id: K6
title: Reading a ceiling fraction
folder: K6-ceiling-fraction-readings
type: knowledge-check
difficulty: 1
tier: L1
kind: written
points: 4
evidence_required: Interpretation of a ceiling fraction above 1.0 and of 0.1.
marking:
  - criterion: Above 1.0 is physically impossible and means a data error, with at least two plausible causes (units, bidirectional counter, double count, wrong time)
    points: 2
  - criterion: 0.1 means no throughput ceiling explains the time
    points: 1
  - criterion: Names what does dominate at 0.1 (latency, launch overhead, synchronization, queueing or stragglers)
    points: 1
lab_checks: []
