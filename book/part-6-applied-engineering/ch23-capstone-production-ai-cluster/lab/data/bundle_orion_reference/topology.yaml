bundle: orion-256-reference
backend:
  transport: RoCEv2
  rails: 8
  rail_leaf:
    count: 8
    radix: 64
    downlinks: 32
    uplinks: 32
    uplinks_per_spine: 8
  spine:
    count: 4
    radix: 64
  claimed_oversubscription: '1:1'
frontend:
  ports_per_node: 2
  speed_gbps: 200
  claimed_oversubscription: 1.5:1
  oversubscription_basis: 'bandwidth (48 x 200G down : 16 x 400G up); 3:1 by port count'
