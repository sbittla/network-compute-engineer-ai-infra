dedupe_rules_version: "ch24-role-v1"
dedupe_rules: >
  Two rows are the same ROLE when they share role_key = casefold(employer) + "|" + normalised title, where the
  title is casefolded, whitespace-collapsed, a trailing location qualifier is removed ("(Kansas City)",
  "- Memphis", "(Amsterdam)", "(Columbus)"), and level punctuation is unified ("Staff+" = "Staff"). Location,
  requisition ID and small wording differences in the body do not create a new role. Different seniority bands
  in the title ("Staff / Senior Staff" vs "Senior/Junior", "II" vs "III") DO create a new role. The kept row is the
  earliest collected row (all rows share date_checked, the chapter's tie rule); its location field is the union
  of all merged locations and merged_job_ids lists the other requisitions. The lab's posting-level rule
  (employer+job_id or canonical URL) is necessary but not sufficient here: it finds 0 duplicates among the 60
  collected rows.
seniority_rule: >
  From the title only: Junior/Senior (also "Sr.")/Staff/Principal map to the level ("Senior Staff" -> staff,
  "Senior Principal" -> principal). A title naming more than one level -> mixed. No level in the title ->
  unspecified (years of experience in the body were not converted to a level; numeric grades such as "II" or
  "III" are not mapped to a level).
skills_rule: >
  required_skills: the posting's required / minimum / basic qualifications or "what we need to see" list; where
  the posting only has a "you might thrive if" list, that list. preferred_skills: nice-to-have / preferred /
  bonus / "ways to stand out" / "differentiators" list. Empty preferred_skills means the posting had no separate
  list.
url_rule: >
  url is the employer's ATS posting URL. CoreWeave publishes coreweave.com/careers/job?<id>&... whose identity
  lives in the query string. A strip-all-queries rule would collapse those rows (50 -> 47 roles); the chapter's
  normalize_url strips only tracking parameters and keeps the rest. For stability, url on CoreWeave rows is the
  Greenhouse board URL (it redirects to the employer page) and employer_url keeps the employer's own link.
employer_note: >
  employer is recorded exactly as each board listed it on 2026-11-06. The xAI Greenhouse board (slug xai)
  listed its employer as "SpaceXSI"; the manuscript's Table 24.7 uses the brand name xAI for the same employer.
role_families: [ai_network, gpu_hpc, cluster_platform, performance, sre_ops, hw_vendor, dc_facilities, inference_platform]
required_fields:
