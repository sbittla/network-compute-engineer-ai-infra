# Metadata for the REAL, dated job-posting register (release gate G7), November 2026 refresh. Not used by check.py.
# The synthetic teaching register (job_register.csv + register_meta.yaml) and the 2026-10 files are unchanged.
as_of: '2026-11-06'
synthetic: false
evidence_class: "OBSERVED public postings, accessed 2026-11-06 (a dated snapshot, not a census)"
note: >
  Real public job postings read on the employers' own applicant-tracking-system (ATS) listings on 2026-11-06.
  Every row was listed as open on that date. Postings close and change: re-check every URL before citing
  a row, and treat the whole file as stale after 2026-12-06 (as_of + stale_active_after_days).
  Skill fields are short normalised tags paraphrasing the posting's own wording; read the posting itself
  for exact text. Salaries were deliberately not recorded.
  This refresh re-read every 2026-10 requisition that was still listed (47 of 50) and re-tagged it against the
  posting's current text; 3 had closed. 13 new requisitions were added by the same title filter and purposive
  selection. Field changes on carried-over rows are listed under refresh_changes.
