marking:
- criterion: 'Bandwidth: driver stages through a pinned bounce buffer with a CPU memcpy (about 10-25 GB/s
    vs about 50 GB/s pinned on Gen5 x16)'
  points: 1
- criterion: 'Host blocking: the call returns only after staging (or after completion for D2H), so the
    CPU cannot run ahead'
  points: 1
- criterion: 'No overlap: the copy serializes with the stream and cannot run concurrently with kernels
    on a side stream'
  points: 1
