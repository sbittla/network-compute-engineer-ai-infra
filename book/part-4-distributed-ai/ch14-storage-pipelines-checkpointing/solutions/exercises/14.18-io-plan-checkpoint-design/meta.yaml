id: '14.18'
title: 'Deliverable: I/O benchmark plan and checkpoint/recovery design'
folder: 14.18-io-plan-checkpoint-design
type: deliverable
difficulty: 3
tier: L1
kind: lab
points: 30
evidence_required: the document, the planner output it cites, and the validator run on the lab store
marking:
- criterion: 'Benchmark plan: NVMe, PFS bandwidth, PFS metadata (mdtest), read-under-write; exact parameters,
    warm-up, ≥ 5 reps, percentiles, manifest fields'
  points: 8
- criterion: 'Checkpoint design: strategy, interval with derivation, staging memory, commit protocol,
    validation ladder, retention, archive'
  points: 8
- criterion: 'RPO/RTO analysis: time-to-resume components, lost GPU-h/day, sensitivity to M and detection
    time'
  points: 6
- criterion: Restore test procedure including a planted corrupt checkpoint and a semantic loss check
  points: 4
- criterion: Measured vs modeled statement; evidence labels throughout
  points: 4
lab_checks:
- A6 strategy comparison
- C1 audit checkpoint store
- C2 select latest valid
- C3 validator on unseen defects
