configs:
  A_as_found:
    description: 'leaf-r3 as found: PFC on, ECN Kmin 1500 KB / Kmax 6000 KB / Pmax
      0.2'
    pfc_enabled: true
    ecn_kmin_kb: 1500
    ecn_kmax_kb: 6000
    ecn_pmax: 0.2
  B_template:
    description: 'fabric template: PFC on, ECN Kmin 150 KB / Kmax 1500 KB / Pmax 0.2'
    pfc_enabled: true
    ecn_kmin_kb: 150
    ecn_kmax_kb: 1500
    ecn_pmax: 0.2
