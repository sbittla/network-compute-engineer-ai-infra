id: 10.H1
title: Link-health analyzer and commissioning report
folder: 10.H1-link-health-analyzer
type: hands-on-lab
difficulty: 3
tier: L1
kind: lab
points: 100
evidence_required: '`python check.py` output showing that all checks pass (the data-regeneration check may report
  SKIP); the generated `commissioning-report.md`;
  `diagnosis.md` explaining every non-healthy port (evidence, layer, root cause hypothesis, first safe
  action, missing hardware evidence) and every decoy you identified.'
marking:
- criterion: 'Task 1–2: counter_delta, line rate, FEC margin and compute_deltas checks pass'
  points: 20
- criterion: 'Task 3: layer_classification, primary_findings, per_port_digest and severity_policy pass'
  points: 35
- criterion: 'Tasks 4–5: commissioning_report (FAIL, 57/64) and link_budget pass'
  points: 15
- criterion: 'Tasks 6–7: bom_and_spares and cabling_schedule pass'
  points: 20
- criterion: 'diagnosis.md: 1 point per correctly explained non-healthy port (9) + 1 for a decoy; −2 for
    cleaning Ethernet12/27, replacing Ethernet45''s fiber, or touching an undrained link'
  points: 10
lab_checks:
- 'dataset_reproducible:'
- 'counter_delta:'
- 'pcs_fec_line_rate:'
- 'fec_margin_decades:'
- 'compute_deltas:'
- 'layer_classification:'
- 'primary_findings:'
- 'per_port_digest:'
- 'severity_policy:'
- 'commissioning_report:'
- 'link_budget:'
- 'bom_and_spares:'
- 'cabling_schedule:'
