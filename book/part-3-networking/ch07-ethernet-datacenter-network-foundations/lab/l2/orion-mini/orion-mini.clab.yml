# ORION-mini: 2 spines x 4 rail leaves x 2 hosts, eBGP + BFD (Lab 7, L2 extension).
# Generated by render.py; isolated lab use only. Untested in the course harness.
name: orion-mini
topology:
  nodes:
    spine-1:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/spine-1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    spine-2:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/spine-2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf-r0:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/leaf-r0/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf-r1:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/leaf-r1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf-r2:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/leaf-r2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf-r3:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0
      binds:
        - configs/leaf-r3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    n01:
      kind: linux
      image: alpine:3.19
      exec:
        - "ip link set eth1 mtu 9000"
        - "ip addr add 10.100.0.3/31 dev eth1"
        - "ip rule add from 10.100.0.3 table 100"
        - "ip route add 10.100.0.0/16 via 10.100.0.2 dev eth1 table 100"
        - "ip link set eth2 mtu 9000"
        - "ip addr add 10.100.1.3/31 dev eth2"
        - "ip rule add from 10.100.1.3 table 101"
        - "ip route add 10.100.0.0/16 via 10.100.1.2 dev eth2 table 101"
        - "ip link set eth3 mtu 9000"
        - "ip addr add 10.100.2.3/31 dev eth3"
        - "ip rule add from 10.100.2.3 table 102"
        - "ip route add 10.100.0.0/16 via 10.100.2.2 dev eth3 table 102"
        - "ip link set eth4 mtu 9000"
        - "ip addr add 10.100.3.3/31 dev eth4"
        - "ip rule add from 10.100.3.3 table 103"
        - "ip route add 10.100.0.0/16 via 10.100.3.2 dev eth4 table 103"
        - "ip route add 10.100.0.0/16 via 10.100.0.2 dev eth1"
    n02:
      kind: linux
      image: alpine:3.19
      exec:
        - "ip link set eth1 mtu 9000"
        - "ip addr add 10.100.0.5/31 dev eth1"
        - "ip rule add from 10.100.0.5 table 100"
        - "ip route add 10.100.0.0/16 via 10.100.0.4 dev eth1 table 100"
        - "ip link set eth2 mtu 9000"
        - "ip addr add 10.100.1.5/31 dev eth2"
        - "ip rule add from 10.100.1.5 table 101"
        - "ip route add 10.100.0.0/16 via 10.100.1.4 dev eth2 table 101"
        - "ip link set eth3 mtu 9000"
        - "ip addr add 10.100.2.5/31 dev eth3"
        - "ip rule add from 10.100.2.5 table 102"
        - "ip route add 10.100.0.0/16 via 10.100.2.4 dev eth3 table 102"
        - "ip link set eth4 mtu 9000"
        - "ip addr add 10.100.3.5/31 dev eth4"
        - "ip rule add from 10.100.3.5 table 103"
        - "ip route add 10.100.0.0/16 via 10.100.3.4 dev eth4 table 103"
        - "ip route add 10.100.0.0/16 via 10.100.0.4 dev eth1"
  links:
    - endpoints: ["leaf-r0:eth1", "n01:eth1"]
    - endpoints: ["leaf-r0:eth2", "n02:eth1"]
    - endpoints: ["leaf-r0:eth3", "spine-1:eth1"]
    - endpoints: ["leaf-r0:eth4", "spine-2:eth1"]
    - endpoints: ["leaf-r1:eth1", "n01:eth2"]
    - endpoints: ["leaf-r1:eth2", "n02:eth2"]
    - endpoints: ["leaf-r1:eth3", "spine-1:eth2"]
    - endpoints: ["leaf-r1:eth4", "spine-2:eth2"]
    - endpoints: ["leaf-r2:eth1", "n01:eth3"]
    - endpoints: ["leaf-r2:eth2", "n02:eth3"]
    - endpoints: ["leaf-r2:eth3", "spine-1:eth3"]
    - endpoints: ["leaf-r2:eth4", "spine-2:eth3"]
    - endpoints: ["leaf-r3:eth1", "n01:eth4"]
    - endpoints: ["leaf-r3:eth2", "n02:eth4"]
    - endpoints: ["leaf-r3:eth3", "spine-1:eth4"]
    - endpoints: ["leaf-r3:eth4", "spine-2:eth4"]
