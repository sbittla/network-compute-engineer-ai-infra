frr defaults traditional
hostname spine-2
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description leaf-r0
 ip address 10.101.2.0/31
!
interface eth2
 description leaf-r1
 ip address 10.101.2.16/31
!
interface eth3
 description leaf-r2
 ip address 10.101.2.32/31
!
interface eth4
 description leaf-r3
 ip address 10.101.2.48/31
!
router bgp 65100
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.101.2.1 remote-as 65101
 neighbor 10.101.2.1 bfd
 neighbor 10.101.2.1 timers 3 9
 neighbor 10.101.2.1 advertisement-interval 0
 neighbor 10.101.2.17 remote-as 65102
 neighbor 10.101.2.17 bfd
 neighbor 10.101.2.17 timers 3 9
 neighbor 10.101.2.17 advertisement-interval 0
 neighbor 10.101.2.33 remote-as 65103
 neighbor 10.101.2.33 bfd
 neighbor 10.101.2.33 timers 3 9
 neighbor 10.101.2.33 advertisement-interval 0
 neighbor 10.101.2.49 remote-as 65104
 neighbor 10.101.2.49 bfd
 neighbor 10.101.2.49 timers 3 9
 neighbor 10.101.2.49 advertisement-interval 0
 address-family ipv4 unicast
  network 10.255.0.2/32
  maximum-paths 64
 exit-address-family
!
