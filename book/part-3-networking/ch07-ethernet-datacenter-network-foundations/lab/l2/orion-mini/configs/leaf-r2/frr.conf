frr defaults traditional
hostname leaf-r2
!
interface lo
 ip address 10.255.0.13/32
!
interface eth1
 description orion-n01 nic2
 ip address 10.100.2.2/31
!
interface eth2
 description orion-n02 nic2
 ip address 10.100.2.4/31
!
interface eth3
 description spine-1
 ip address 10.101.1.33/31
!
interface eth4
 description spine-2
 ip address 10.101.2.33/31
!
ip prefix-list HOST-LINKS seq 10 permit 10.100.2.0/24 le 31
route-map HOST-LINKS permit 10
 match ip address prefix-list HOST-LINKS
!
router bgp 65103
 bgp router-id 10.255.0.13
 no bgp ebgp-requires-policy
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65100
 neighbor SPINES bfd
 neighbor SPINES timers 3 9
 neighbor SPINES advertisement-interval 0
 neighbor 10.101.1.32 peer-group SPINES
 neighbor 10.101.2.32 peer-group SPINES
 address-family ipv4 unicast
  network 10.255.0.13/32
  aggregate-address 10.100.2.0/24 summary-only
  redistribute connected route-map HOST-LINKS
  maximum-paths 64
 exit-address-family
!
