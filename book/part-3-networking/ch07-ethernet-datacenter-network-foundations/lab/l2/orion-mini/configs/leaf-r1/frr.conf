frr defaults traditional
hostname leaf-r1
!
interface lo
 ip address 10.255.0.12/32
!
interface eth1
 description orion-n01 nic1
 ip address 10.100.1.2/31
!
interface eth2
 description orion-n02 nic1
 ip address 10.100.1.4/31
!
interface eth3
 description spine-1
 ip address 10.101.1.17/31
!
interface eth4
 description spine-2
 ip address 10.101.2.17/31
!
ip prefix-list HOST-LINKS seq 10 permit 10.100.1.0/24 le 31
route-map HOST-LINKS permit 10
 match ip address prefix-list HOST-LINKS
!
router bgp 65102
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65100
 neighbor SPINES bfd
 neighbor SPINES timers 3 9
 neighbor SPINES advertisement-interval 0
 neighbor 10.101.1.16 peer-group SPINES
 neighbor 10.101.2.16 peer-group SPINES
 address-family ipv4 unicast
  network 10.255.0.12/32
  aggregate-address 10.100.1.0/24 summary-only
  redistribute connected route-map HOST-LINKS
  maximum-paths 64
 exit-address-family
!
