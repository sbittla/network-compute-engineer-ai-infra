frr defaults traditional
hostname spine-1
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description leaf-r0
 ip address 10.101.1.0/31
!
interface eth2
 description leaf-r1
 ip address 10.101.1.16/31
!
interface eth3
 description leaf-r2
 ip address 10.101.1.32/31
!
interface eth4
 description leaf-r3
 ip address 10.101.1.48/31
!
router bgp 65100
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.101.1.1 remote-as 65101
 neighbor 10.101.1.1 bfd
 neighbor 10.101.1.1 timers 3 9
 neighbor 10.101.1.1 advertisement-interval 0
 neighbor 10.101.1.17 remote-as 65102
 neighbor 10.101.1.17 bfd
 neighbor 10.101.1.17 timers 3 9
 neighbor 10.101.1.17 advertisement-interval 0
 neighbor 10.101.1.33 remote-as 65103
 neighbor 10.101.1.33 bfd
 neighbor 10.101.1.33 timers 3 9
 neighbor 10.101.1.33 advertisement-interval 0
 neighbor 10.101.1.49 remote-as 65104
 neighbor 10.101.1.49 bfd
 neighbor 10.101.1.49 timers 3 9
 neighbor 10.101.1.49 advertisement-interval 0
 address-family ipv4 unicast
  network 10.255.0.1/32
  maximum-paths 64
 exit-address-family
!
