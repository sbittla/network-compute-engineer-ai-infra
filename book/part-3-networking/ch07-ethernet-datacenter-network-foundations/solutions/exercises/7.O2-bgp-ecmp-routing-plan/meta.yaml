id: 7.O2
title: BGP/ECMP routing plan and failure behaviour
folder: 7.O2-bgp-ecmp-routing-plan
type: outline-mandated
difficulty: 2
tier: L1
kind: computed
points: 10
evidence_required: the plan, a failure table with all five columns for all three failures, and consistency
