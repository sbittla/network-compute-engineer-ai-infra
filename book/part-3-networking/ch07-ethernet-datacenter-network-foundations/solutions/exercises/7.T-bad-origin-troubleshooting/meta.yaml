id: 7.T
title: Half the flows to rail 6 fail after a template push
folder: 7.T-bad-origin-troubleshooting
type: troubleshooting
difficulty: 3
tier: L1
kind: written
points: 20
evidence_required: a completed checklist table, ranked hypotheses with the discriminating evidence cited
  by item number, and a fix/validate/prevent plan with measurable acceptance criteria.
marking:
- criterion: (a) Checklist covers the three hypotheses against size, flow, prefix, counters, path trace,
    BGP view and change history, with what the pack shows
  points: 6
- criterion: (b) Ranks incorrect advertisement first and explains the 2-of-4 spine split from item 8 (compare-routerid
    on spines 1 and 3, oldest-path on 2 and 4)
  points: 5
- criterion: (c) 16 of 32 uplinks lead to spines 1 and 3, so ≈ 50 % of flows fail (31/64 consistent, σ
    = 4); single pings are hash luck, not a rail property
  points: 3
- criterion: '(d) Rebuts asymmetric routing: normal in ECMP without stateful devices or strict uRPF, and
    cannot explain prefix-specific loss or the extra origin AS'
  points: 2
- criterion: (e) Safe fix (inbound prefix filter, then template revert, under change control), measurable
    validation and at least two preventive controls
  points: 4
lab_checks: []
